<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery Page</title>
  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: "Pretendard", sans-serif;
      color: #111;
    }

    header {
      padding: 2rem;
      text-align: center;
      font-size: 2rem;
      font-weight: 600;
      border-bottom: 1px solid #e5e5e5;
    }

    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .item {
      background: #fafafa;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      transition: transform 0.2s ease;
    }

    .item:hover {
      transform: translateY(-4px);
    }

    .item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .caption {
      padding: 1rem;
      font-size: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>미술관 갤러리 스타일 페이지</header>

  <div class="gallery-container">
    <div class="item">
      <img src="https://picsum.photos/800/600?random=1" alt="Artwork 1" />
      <div class="caption">작품 제목 1</div>
    </div>

    <div class="item">
      <img src="https://picsum.photos/800/600?random=2" alt="Artwork 2" />
      <div class="caption">작품 제목 2</div>
    </div>

    <div class="item">
      <img src="https://picsum.photos/800/600?random=3" alt="Artwork 3" />
      <div class="caption">작품 제목 3</div>
    </div>

    <div class="item">
      <img src="https://picsum.photos/800/600?random=4" alt="Artwork 4" />
      <div class="caption">작품 제목 4</div>
    </div>
  </div>
</body>
</html>
